[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/karyalabs/gpui-av"
publish = false

[workspace.dependencies]
gpui-av = { path = "crates/gpui-av" }
# The one GPUI snapshot the workspace builds against (spec section 6, R1).
# gpui-av uses the GPUI core crate only, never a platform crate.
gpui = { package = "gpui-pre", version = "=0.3.12", default-features = false }
async-channel = { version = "2.5", default-features = false }

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
