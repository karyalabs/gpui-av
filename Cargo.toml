[workspace]
members = ["crates/*", "lab"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/karyalabs/gpui-av"
publish = false

[workspace.dependencies]
gpui-av = { path = "crates/gpui-av", version = "0.0.0" }
# The one GPUI snapshot the workspace builds against (spec section 6, R1).
# gpui-av uses the GPUI core crate only, never a platform crate.
gpui = { package = "gpui-pre", version = "=0.3.12", default-features = false }
async-channel = { version = "2.5", default-features = false }
gpui-av-avfoundation = { path = "crates/gpui-av-avfoundation", version = "0.0.0" }
gpui-av-web = { path = "crates/gpui-av-web", version = "0.0.0" }
gpui-av-gstreamer = { path = "crates/gpui-av-gstreamer", version = "0.0.0" }
gpui-av-mediafoundation = { path = "crates/gpui-av-mediafoundation", version = "0.0.0" }
gpui-av-remux = { path = "crates/gpui-av-remux", version = "0.0.0" }
gpui-av-platform = { path = "crates/gpui-av-platform", version = "0.0.0", default-features = false }
libloading = "0.8"
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit"] }
# The versions GPUI itself uses, for building frames by hand.
image = { version = "0.25.1", default-features = false }
smallvec = "1.6"
# std::time::Instant does not exist in a browser; this one does.
web-time = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Process CPU time and memory for the lab's bench (not in a browser).
cpu-time = "1"
memory-stats = "1.2"
# Browser bindings, for the web backend and the lab's web entry. The
# wasm-bindgen CLI that scripts/web runs must be this exact version.
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Karya Labs' GPUI (spec 4.3): the gpui-pre crates our patches change, from
# karyalabs/zed. Only this workspace's builds use them; a crate published
# from here still builds on stock gpui-pre for its users.
[patch.crates-io]
gpui-pre-apple = { git = "https://github.com/karyalabs/zed", branch = "crates/gpui-pre-0.3.12" }
gpui-pre-macos = { git = "https://github.com/karyalabs/zed", branch = "crates/gpui-pre-0.3.12" }
