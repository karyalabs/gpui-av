[package]
name = "gpui-av-lab"
description = "The playground and benchmark app for gpui-av."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The workspace builds on Karya Labs' GPUI (spec 4.3), so the lab draws
# through it by default; `--no-default-features` plays the stock way.
default = ["karya-gpui"]
karya-gpui = ["gpui-av-avfoundation/karya-gpui"]

[dependencies]
gpui-av.workspace = true
gpui.workspace = true
gpui-platform.workspace = true
image.workspace = true
smallvec.workspace = true
web-time.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
cpu-time.workspace = true
memory-stats.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
gpui-av-web.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = [
    "Blob",
    "BlobPropertyBag",
    "Document",
    "Element",
    "HtmlAnchorElement",
    "HtmlElement",
    "Location",
    "RequestInit",
    "Response",
    "Url",
    "UrlSearchParams",
    "Window",
    "console",
] }

[target.'cfg(target_os = "macos")'.dependencies]
gpui-av-avfoundation.workspace = true
# Compile GPUI's Metal shaders at run time, so building needs no Metal
# toolchain (Xcode 26+ downloads it separately).
gpui-platform = { workspace = true, features = ["runtime_shaders"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
