# Deliberately minimal while gpui-av is early (Arya, 2026-11-13): one fast
# job that checks formatting and that the workspace compiles on Linux.
# Tests, clippy, the macOS backend and the web build run locally for now.
# The job is named `ci`, the one check karyalabs/matty
# docs/engineering-process.md says to require.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: karyalabs/.github/actions/rust-toolchain@v1
      - uses: karyalabs/.github/actions/gpui-deps@v1
      - run: cargo fmt --all --check
      - run: cargo check --workspace --locked
