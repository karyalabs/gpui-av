# The Windows backend on a real Windows machine. Not part of `ci`: it runs
# only by hand (Actions, "Windows", "Run workflow"), sparingly, since a
# private repository's Windows minutes count double against the plan's
# included minutes. Nothing waits for it to merge. It plays clips that
# ffmpeg makes on the runner; no video is committed.
name: Windows

on:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: karyalabs/.github/actions/rust-toolchain@v1
      - name: ffmpeg, for the test clips
        run: choco install ffmpeg -y --no-progress
      - name: Make the tier A clips
        shell: bash
        run: scripts/make-clips.sh clips
      - name: The backend without a window
        shell: bash
        env:
          # cargo runs each test in its crate folder, so the path must be absolute.
          GPUI_AV_TEST_CLIP: ${{ github.workspace }}/clips/h264-1280x720.mp4
          GPUI_AV_MEDIAFOUNDATION_TRACE: 1
        run: cargo test --locked -p gpui-av-mediafoundation -p gpui-av-platform
      - name: The lab's bench, in a window
        # A hosted runner's desktop may not give GPUI a window; the result
        # is kept either way.
        continue-on-error: true
        shell: bash
        run: |
          cargo run --locked --release -p gpui-av-lab -- \
            --bench corpus/tier-a.json --clips clips --backend mediafoundation --out bench-windows.json
      - name: Make the tier B clips
        continue-on-error: true
        shell: bash
        run: scripts/make-tier-b.sh clips-b
      - name: The lab's bench on tier B, for the coverage table
        continue-on-error: true
        shell: bash
        run: |
          cargo run --locked --release -p gpui-av-lab -- \
            --bench corpus/tier-b.json --clips clips-b --backend mediafoundation --out bench-windows-b.json
      - name: GStreamer, for the fallback after Media Foundation
        continue-on-error: true
        run: choco install gstreamer -y --no-progress
      - name: Where GStreamer went
        continue-on-error: true
        shell: bash
        run: |
          ls "/c/Program Files/gstreamer/1.0/msvc_x86_64/bin" | grep -c dll || true
          ls "/c/Program Files/gstreamer/1.0/msvc_x86_64/lib/gstreamer-1.0" | grep -E "libav|vpx|dav1d|aom|opus|matroska|isomp4" || true
      - name: The lab's bench on tier B through the fallback
        continue-on-error: true
        shell: bash
        run: |
          cargo run --locked --release -p gpui-av-lab -- \
            --bench corpus/tier-b.json --clips clips-b --backend fallback --out bench-windows-b-fallback.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-windows
          path: bench-windows*.json
          if-no-files-found: ignore
